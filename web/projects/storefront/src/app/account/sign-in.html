<div class="frame">
  <mat-card appearance="outlined" class="card">
    <mat-card-content>
      <h1>Sign in</h1>
      <p class="muted">To order, and to see what you have ordered before.</p>

      @if (afterPasswordChange()) {
        <p class="sent">
          <mat-icon>lock_reset</mat-icon>
          <span>Your password is changed. Sign in with the new one.</span>
        </p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        @if (error(); as message) {
          <p class="failed" role="alert">{{ message }}</p>
        }

        <button matButton="filled" type="submit" [disabled]="busy()">Sign in</button>
      </form>

      <div class="other">
        <a routerLink="/forgot-password">I have forgotten my password</a>
        <a routerLink="/register">Create an account</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
