name: CI

# Path-scoped, which ADR-01 called out as the cost of a monorepo: an Angular change in a later
# phase must not rebuild and re-test the API.
on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "api/**"
      - "web/**"
      - "global.json"
      - ".editorconfig"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - "global.json"
      - ".editorconfig"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# A second push supersedes the first. No point finishing a run for a commit nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: api/OrderingSystem.slnx

jobs:
  api:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Version comes from global.json, so CI and every developer machine cannot drift.
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Central package management means one file decides every version, so it is the
          # only thing the cache key needs to watch.
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # Warnings are errors in Directory.Build.props, so this step also enforces code style
      # and catches vulnerable transitive packages at restore time.
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # The integration tests start a real SQL Server through Testcontainers. GitHub's
      # ubuntu runners ship a working Docker daemon, so nothing extra is needed here.
      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  security:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # A build catches advisories known on the day the lock was written. This re-asks the
      # question on every run, which is how a newly disclosed CVE in a package we already
      # depend on becomes visible. Transitive included: the one we hit came in through
      # Testcontainers, not from anything we referenced directly.
      - name: Check for vulnerable packages
        run: |
          dotnet list ${{ env.SOLUTION }} package --vulnerable --include-transitive \
            > vulnerable.txt 2>&1 || true
          cat vulnerable.txt
          if grep -qiE '\b(Critical|High|Moderate)\b' vulnerable.txt; then
            echo "::error::Vulnerable package(s) found - see the listing above."
            exit 1
          fi
          echo "No vulnerable packages."

      - name: Check for deprecated packages
        run: dotnet list ${{ env.SOLUTION }} package --deprecated --include-transitive

  web:
    name: Build and test web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # Version comes from web/.nvmrc, the same way the API's comes from global.json.
      # Angular refuses to run on an unsupported Node, so drift here is a hard failure.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: it installs exactly what the lock file says and fails if
      # package.json and the lock have drifted apart.
      - name: Install dependencies
        run: npm ci

      # The API has TreatWarningsAsErrors and .editorconfig doing this job; the front end had
      # nothing. Formatting arguments are not worth a reviewer's attention.
      - name: Check formatting
        run: npm run format:check

      # Only the two applications are built.
      #
      # api-client, auth and ui are consumed through tsconfig `paths` that point at their
      # sources, so an application build compiles those sources as part of its own program —
      # a type error in a library fails the build below, which is the coverage we actually
      # want. Running `ng build auth` on top of that would package the library for npm, which
      # is not something this workspace does and cannot work while the paths resolve to source
      # (ng-packagr rejects files outside the library's rootDir). See web/README.md.
      - name: Build applications
        run: |
          npx ng build dashboard --configuration production
          npx ng build storefront --configuration production

      # Every project that has specs, named explicitly. A bare `ng test` would run one project
      # and quietly leave the rest unverified — which is how the auth interceptor suite, the
      # most load-bearing tests on the front end, ended up never running here.
      - name: Test
        run: |
          npx ng test dashboard --watch=false
          npx ng test storefront --watch=false
          npx ng test auth --watch=false
          npx ng test realtime --watch=false
          npx ng test ui --watch=false

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A real database, because the point of these tests is that the pieces are joined. The other
    # suites already prove each piece on its own; only this one proves a dish typed into the
    # dashboard reaches a table and comes back on the public menu.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Your_Strong_Passw0rd
        ports:
          - 1433:1433

    env:
      # Spelled out rather than referenced from a variable: the env context is not dependable
      # inside a services block, and a pipeline that fails on its first run is worse than a
      # repeated literal. The database lives for one job and is destroyed with it.
      ConnectionStrings__Default: "Server=localhost,1433;Database=OrderingSystem;User Id=sa;Password=Your_Strong_Passw0rd;TrustServerCertificate=True;Encrypt=True"
      # Not a secret: this database exists for the length of one job and is thrown away with it.
      # The real key comes from configuration per environment, and appsettings.json ships empty.
      Jwt__SigningKey: "ci-only-end-to-end-signing-key-not-a-secret-32+"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Only Chromium. Three browsers would triple the slowest job in the pipeline to catch
      # rendering differences these tests do not look at.
      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The image has no healthcheck, so the port opening is the signal to wait for.
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server is accepting connections"
              exit 0
            fi
            sleep 2
          done
          echo "::error::SQL Server did not start within two minutes"
          exit 1

      # Migrations and demo data, then it exits. The API does not seed itself on startup - a
      # seeder that runs itself eventually runs somewhere it should not.
      - name: Create and seed the database
        run: dotnet run --project api/src/OrderingSystem.Api --no-launch-profile -- --seed

      - name: Start the API
        run: |
          dotnet run --project api/src/OrderingSystem.Api --no-launch-profile \
            --urls http://localhost:5080 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/health)" = "200" ]; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API did not become healthy"
          cat /tmp/api.log
          exit 1

      # Playwright starts the Angular dev server itself; see webServer in playwright.config.ts.
      - name: Run the end-to-end tests
        working-directory: web
        run: npx playwright test

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Upload the API log when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: /tmp/api.log
          retention-days: 7

  contract:
    name: API client is current
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Regenerates the OpenAPI document and the TypeScript client from the API as it stands on
      # this commit, then checks the committed copies match.
      #
      # Without this, changing an endpoint and forgetting to regenerate leaves the Angular apps
      # compiling happily against a contract the server no longer honours - and the first sign
      # is an `undefined` in front of a user. ADR-14 chose a generated client precisely so that
      # mismatch becomes a build failure; this is the step that makes that true.
      - name: Regenerate the API client
        run: ./scripts/generate-api-client.sh

      - name: Fail if the committed client is stale
        run: |
          if ! git diff --exit-code -- api/openapi web/projects/shared/api-client/src/lib; then
            echo "::error::The API surface changed but the generated client was not regenerated."
            echo "::error::Run scripts/generate-api-client.sh (or .ps1) and commit the result."
            exit 1
          fi
          echo "Generated client matches the API."
